openapi: 3.1.0
info:
  title: StrataDrive API
  version: 0.2.0
  description: Local synthetic enquiry intake. Success follows a committed private database record; no booking
    or notification is created. Execution coverage is recorded separately.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: http://127.0.0.1:3100
    description: Isolated local validation server only
paths:
  /api/v1/enquiries:
    post:
      operationId: createEnquiry
      tags:
        - Enquiries
      summary: Save a synthetic local enquiry
      security: []
      description: At most 8192 actual UTF-8 body bytes and five seconds to read the body. Both raw and normalized
        schemas apply. Identity content encoding only. UUIDv4 key replays the same canonical private fields;
        changed content conflicts. Twenty new receipts per fixed ten-minute DB window. Keys remain while
        records exist; explicit local cleanup ends replay protection. The browser draft/key is not retained
        across refresh. No public lookup operation, booking or notification.
      x-normalized-schema: "#/components/schemas/EnquiryNormalized"
      x-requirement-ids:
        - BR-P1-ENQ-001
        - BR-P1-PRIV-001
        - TR-P1-ENQ-001
        - TR-P1-DURABLE-001
        - TR-P1-RETRY-001
        - NFR-P1-PRIV-001
        - NFR-P1-ABUSE-001
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          description: UUIDv4 for one submission intent. Keep it unchanged on an uncertain retry.
          schema:
            type: string
            format: uuid
            pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-4[0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnquiryRequest"
            example: &a4
              name: Test Learner
              email: learner@example.test
              message: Synthetic enquiry for local manual testing.
      responses:
        "200":
          description: Original receipt for an identical idempotent retry; no new quota charged.
          headers: &a1
            Cache-Control: &a3
              required: true
              description: Responses must not be stored.
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnquiryReceipt"
              example: &a2
                enquiryId: 5d826d0f-82a4-4867-ad59-38c850d9104d
                receivedAt: 2026-10-25T01:00:00.000Z
                status: received
        "201":
          description: New enquiry committed; no lesson booked.
          headers: *a1
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnquiryReceipt"
              example: *a2
        "400":
          description: INVALID_REQUEST. No sensitive submitted values are returned.
          headers:
            Cache-Control: *a3
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/EnquiryError"
                  - type: object
                    properties:
                      code:
                        const: INVALID_REQUEST
              example:
                code: INVALID_REQUEST
                message: Check your enquiry details.
        "403":
          description: REQUEST_NOT_ALLOWED. No sensitive submitted values are returned.
          headers:
            Cache-Control: *a3
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/EnquiryError"
                  - type: object
                    properties:
                      code:
                        const: REQUEST_NOT_ALLOWED
                      fieldErrors: false
              example:
                code: REQUEST_NOT_ALLOWED
                message: This request is not allowed.
        "408":
          description: REQUEST_TIMEOUT. No sensitive submitted values are returned.
          headers:
            Cache-Control: *a3
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/EnquiryError"
                  - type: object
                    properties:
                      code:
                        const: REQUEST_TIMEOUT
                      fieldErrors: false
              example:
                code: REQUEST_TIMEOUT
                message: The request took too long. Please retry.
        "409":
          description: IDEMPOTENCY_CONFLICT. No sensitive submitted values are returned.
          headers:
            Cache-Control: *a3
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/EnquiryError"
                  - type: object
                    properties:
                      code:
                        const: IDEMPOTENCY_CONFLICT
                      fieldErrors: false
              example:
                code: IDEMPOTENCY_CONFLICT
                message: Start a new enquiry to send different details.
        "413":
          description: PAYLOAD_TOO_LARGE. No sensitive submitted values are returned.
          headers:
            Cache-Control: *a3
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/EnquiryError"
                  - type: object
                    properties:
                      code:
                        const: PAYLOAD_TOO_LARGE
                      fieldErrors: false
              example:
                code: PAYLOAD_TOO_LARGE
                message: Your enquiry is too long. Please shorten it.
        "415":
          description: UNSUPPORTED_MEDIA_TYPE. No sensitive submitted values are returned.
          headers:
            Cache-Control: *a3
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/EnquiryError"
                  - type: object
                    properties:
                      code:
                        const: UNSUPPORTED_MEDIA_TYPE
                      fieldErrors: false
              example:
                code: UNSUPPORTED_MEDIA_TYPE
                message: Send your enquiry as UTF-8 JSON.
        "429":
          description: RATE_LIMITED. No sensitive submitted values are returned.
          headers:
            Cache-Control: *a3
            Retry-After:
              required: true
              description: Integer seconds to the next database-clock quota window.
              schema:
                type: integer
                minimum: 1
                maximum: 600
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/EnquiryError"
                  - type: object
                    properties:
                      code:
                        const: RATE_LIMITED
                      fieldErrors: false
              example:
                code: RATE_LIMITED
                message: Please wait before sending another enquiry.
        "500":
          description: INTERNAL_ERROR. No sensitive submitted values are returned.
          headers:
            Cache-Control: *a3
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/EnquiryError"
                  - type: object
                    properties:
                      code:
                        const: INTERNAL_ERROR
                      fieldErrors: false
              example:
                code: INTERNAL_ERROR
                message: We could not confirm your enquiry. Please retry.
        "503":
          description: STORAGE_UNAVAILABLE. No sensitive submitted values are returned.
          headers:
            Cache-Control: *a3
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/EnquiryError"
                  - type: object
                    properties:
                      code:
                        const: STORAGE_UNAVAILABLE
                      fieldErrors: false
              example:
                code: STORAGE_UNAVAILABLE
                message: We could not confirm your enquiry. Please retry.
components:
  schemas:
    Error:
      type: object
      additionalProperties: false
      required:
        - code
        - message
      properties:
        code:
          type: string
          pattern: ^[A-Z][A-Z0-9_]*$
          description: Stable machine-readable error identifier.
        message:
          type: string
          minLength: 1
          description: Safe public message without secrets or personal information.
      examples:
        - code: VALIDATION_ERROR
          message: Invalid request.
    EnquiryRequest:
      type: object
      additionalProperties: false
      required:
        - name
        - email
      description: Raw wire envelope. EnquiryNormalized also applies after trimming/NFC, lowercasing only the email
        domain, and normalizing message line endings. Unknown properties and over-limit raw fields are
        rejected. Unpaired surrogates are rejected.
      properties:
        name: &a5
          type: string
          minLength: 1
          maxLength: 100
          pattern: ^[^\u0000-\u001F\u007F]*[^\s\u0000-\u001F\u007F][^\u0000-\u001F\u007F]*$
        email:
          type: string
          minLength: 3
          maxLength: 254
          pattern: ^[\x20-\x7E]+$
          description: ASCII email; outer whitespace is trimmed before normalized email syntax validation.
        message:
          type: string
          maxLength: 2000
          pattern: ^[^\u0000-\u0008\u000B\u000C\u000E-\u001F\u007F]*$
      examples:
        - *a4
    EnquiryNormalized:
      type: object
      additionalProperties: false
      required:
        - name
        - email
        - message
      description: Normative second validation stage after normalization. Empty or omitted message becomes null.
        Name/email must be nonempty after trimming; all strings must contain valid Unicode scalars.
      properties:
        name: *a5
        email:
          type: string
          format: email
          maxLength: 254
          pattern: ^[\x21-\x7E]+$
        message:
          anyOf:
            - type: string
              maxLength: 2000
              pattern: ^[^\u0000-\u0008\u000B\u000C\u000E-\u001F\u007F]*$
              minLength: 1
            - type: "null"
      examples:
        - *a4
        - name: Test Learner
          email: learner@example.test
          message: null
    EnquiryReceipt:
      type: object
      additionalProperties: false
      required:
        - enquiryId
        - receivedAt
        - status
      properties:
        enquiryId:
          type: string
          format: uuid
        receivedAt:
          type: string
          format: date-time
          pattern: Z$
          description: Database-generated received timestamp in the committed row, serialized in UTC. Not an exact
            commit timestamp.
        status:
          type: string
          const: received
      examples:
        - *a2
    EnquiryFieldErrors:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          const: Enter a name using 1 to 100 characters, without control characters.
        email:
          type: string
          const: Enter a valid email address using at most 254 characters.
        message:
          type: string
          const: Use at most 2,000 characters of plain text, without control characters.
      examples:
        - name: Enter a name using 1 to 100 characters, without control characters.
    EnquiryError:
      type: object
      additionalProperties: false
      required:
        - code
        - message
      properties:
        code:
          type: string
          enum:
            - INVALID_REQUEST
            - REQUEST_NOT_ALLOWED
            - REQUEST_TIMEOUT
            - IDEMPOTENCY_CONFLICT
            - PAYLOAD_TOO_LARGE
            - UNSUPPORTED_MEDIA_TYPE
            - RATE_LIMITED
            - INTERNAL_ERROR
            - STORAGE_UNAVAILABLE
        message:
          type: string
          minLength: 1
          maxLength: 200
        fieldErrors:
          $ref: "#/components/schemas/EnquiryFieldErrors"
      examples:
        - code: INVALID_REQUEST
          message: Check your enquiry details.
      oneOf:
        - type: object
          required:
            - code
            - message
          properties:
            code:
              const: INVALID_REQUEST
            message:
              const: Check your enquiry details.
        - type: object
          required:
            - code
            - message
          properties:
            code:
              const: REQUEST_NOT_ALLOWED
            message:
              const: This request is not allowed.
        - type: object
          required:
            - code
            - message
          properties:
            code:
              const: REQUEST_TIMEOUT
            message:
              const: The request took too long. Please retry.
        - type: object
          required:
            - code
            - message
          properties:
            code:
              const: IDEMPOTENCY_CONFLICT
            message:
              const: Start a new enquiry to send different details.
        - type: object
          required:
            - code
            - message
          properties:
            code:
              const: PAYLOAD_TOO_LARGE
            message:
              const: Your enquiry is too long. Please shorten it.
        - type: object
          required:
            - code
            - message
          properties:
            code:
              const: UNSUPPORTED_MEDIA_TYPE
            message:
              const: Send your enquiry as UTF-8 JSON.
        - type: object
          required:
            - code
            - message
          properties:
            code:
              const: RATE_LIMITED
            message:
              const: Please wait before sending another enquiry.
        - type: object
          required:
            - code
            - message
          properties:
            code:
              const: INTERNAL_ERROR
            message:
              const: We could not confirm your enquiry. Please retry.
        - type: object
          required:
            - code
            - message
          properties:
            code:
              const: STORAGE_UNAVAILABLE
            message:
              const: We could not confirm your enquiry. Please retry.
tags:
  - name: Enquiries
    description: Local synthetic enquiry intake only.
