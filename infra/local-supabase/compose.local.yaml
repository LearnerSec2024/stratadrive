# Local-only derivative of the pinned official distribution. Never merge the
# upstream Compose file into this model: it retains wildcard port mappings.
name: stratadrive-local

services:
  db:
    image: supabase/postgres:17.6.1.136
    restart: "no"
    ports:
      - "127.0.0.1:${STRATA_DB_PORT:-54322}:5432"
    environment:
      POSTGRES_HOST: /var/run/postgresql
      PGPORT: "5432"
      POSTGRES_PORT: "5432"
      PGPASSWORD: ${STRATA_DB_PASSWORD:?Initialize local development credentials}
      POSTGRES_PASSWORD: ${STRATA_DB_PASSWORD:?Initialize local development credentials}
      PGDATABASE: postgres
      POSTGRES_DB: postgres
      JWT_EXP: "3600"
    volumes:
      - type: volume
        source: db-data
        target: /var/lib/postgresql/data
      - type: volume
        source: db-config
        target: /etc/postgresql-custom
      - type: bind
        source: ./upstream/volumes/db/webhooks.sql
        target: /docker-entrypoint-initdb.d/init-scripts/98-webhooks.sql
        read_only: true
        bind: { create_host_path: false }
      - type: bind
        source: ./upstream/volumes/db/roles.sql
        target: /docker-entrypoint-initdb.d/init-scripts/99-roles.sql
        read_only: true
        bind: { create_host_path: false }
      - type: bind
        source: ./upstream/volumes/db/jwt.sql
        target: /docker-entrypoint-initdb.d/init-scripts/99-jwt.sql
        read_only: true
        bind: { create_host_path: false }
      - type: bind
        source: ./bootstrap/100-local-grants.sql
        target: /docker-entrypoint-initdb.d/init-scripts/zz-local-grants.sql
        read_only: true
        bind: { create_host_path: false }
    healthcheck:
      test: [CMD, pg_isready, -U, postgres, -h, localhost]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    command: [postgres, -c, config_file=/etc/postgresql/postgresql.conf, -c, log_statement=none, -c, log_parameter_max_length=0, -c, log_parameter_max_length_on_error=0, -c, log_min_error_statement=panic, -c, log_error_verbosity=terse, -c, log_min_messages=fatal]

  rest:
    image: postgrest/postgrest:v14.18
    restart: "no"
    depends_on:
      db: { condition: service_healthy }
    environment:
      PGRST_DB_URI: postgres://authenticator:${STRATA_DB_PASSWORD:?Initialize local development credentials}@db:5432/postgres
      PGRST_DB_SCHEMAS: public
      PGRST_DB_MAX_ROWS: "1000"
      PGRST_DB_EXTRA_SEARCH_PATH: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_ADMIN_SERVER_PORT: "3001"
      PGRST_ADMIN_SERVER_HOST: localhost
      PGRST_JWT_SECRET: ${STRATA_JWT_SECRET:?Initialize local development credentials}
      PGRST_DB_USE_LEGACY_GUCS: "false"
      PGRST_APP_SETTINGS_JWT_EXP: "3600"
    healthcheck:
      test: [CMD, postgrest, --ready]
      interval: 5s
      timeout: 5s
      retries: 10
    command: [postgrest]

  meta:
    image: supabase/postgres-meta:v0.100.0
    restart: "no"
    depends_on:
      db: { condition: service_healthy }
    environment:
      PG_META_PORT: "8080"
      PG_META_DB_HOST: db
      PG_META_DB_PORT: "5432"
      PG_META_DB_NAME: postgres
      PG_META_DB_USER: postgres
      PG_META_DB_PASSWORD: ${STRATA_DB_PASSWORD:?Initialize local development credentials}
      CRYPTO_KEY: ${STRATA_META_CRYPTO_KEY:?Initialize local development credentials}

  studio:
    image: supabase/studio:2026.10.12-sha-3699278
    restart: "no"
    depends_on:
      meta: { condition: service_started }
      rest: { condition: service_healthy }
    ports:
      - "127.0.0.1:${STRATA_STUDIO_PORT:-54323}:3000"
    environment:
      HOSTNAME: "0.0.0.0"
      STUDIO_PG_META_URL: http://meta:8080
      POSTGRES_PORT: "5432"
      POSTGRES_HOST: db
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: ${STRATA_DB_PASSWORD:?Initialize local development credentials}
      POSTGRES_USER_READ_WRITE: postgres
      PG_META_CRYPTO_KEY: ${STRATA_META_CRYPTO_KEY:?Initialize local development credentials}
      PGRST_DB_SCHEMAS: public
      PGRST_DB_MAX_ROWS: "1000"
      PGRST_DB_EXTRA_SEARCH_PATH: public
      DEFAULT_ORGANIZATION_NAME: StrataDrive local development
      DEFAULT_PROJECT_NAME: Synthetic data only
      OPENAI_API_KEY: ""
      SUPABASE_URL: http://api-gw:8000
      SUPABASE_PUBLIC_URL: http://127.0.0.1:54321
      SUPABASE_ANON_KEY: ${STRATA_ANON_KEY:?Initialize local development credentials}
      SUPABASE_SERVICE_KEY: ${STRATA_SERVICE_ROLE_KEY:?Initialize local development credentials}
      AUTH_JWT_SECRET: ${STRATA_JWT_SECRET:?Initialize local development credentials}
      SUPABASE_PUBLISHABLE_KEY: ""
      SUPABASE_SECRET_KEY: ""
      ENABLED_FEATURES_LOGS_ALL: "false"
      SNIPPETS_MANAGEMENT_FOLDER: /app/snippets
      EDGE_FUNCTIONS_MANAGEMENT_FOLDER: /app/edge-functions
      NEXT_TELEMETRY_DISABLED: "1"
    volumes:
      - type: volume
        source: snippets
        target: /app/snippets
    healthcheck:
      test:
        - CMD-SHELL
        - node -e "fetch('http://localhost:3000/api/platform/profile').then((r) => {if (r.status !== 200) throw new Error(r.status)})"
      timeout: 10s
      interval: 5s
      retries: 10
      start_period: 20s

  api-gw:
    image: envoyproxy/envoy:v1.39.1
    restart: "no"
    depends_on:
      studio: { condition: service_healthy }
    networks:
      default:
        aliases: [envoy, kong]
    ports:
      - "127.0.0.1:${STRATA_API_PORT:-54321}:8000"
    volumes:
      - type: bind
        source: ./upstream/volumes/api/envoy/envoy.yaml
        target: /etc/envoy/envoy.yaml
        read_only: true
        bind: { create_host_path: false }
      - type: bind
        source: ./upstream/volumes/api/envoy/cds.yaml
        target: /etc/envoy/cds.yaml
        read_only: true
        bind: { create_host_path: false }
      - type: bind
        source: ./upstream/volumes/api/envoy/lds.template.yaml
        target: /etc/envoy/lds.template.yaml
        read_only: true
        bind: { create_host_path: false }
      - type: bind
        source: ./upstream/volumes/api/envoy/docker-entrypoint.sh
        target: /docker-entrypoint.sh
        read_only: true
        bind: { create_host_path: false }
    environment:
      ANON_KEY: ${STRATA_ANON_KEY:?Initialize local development credentials}
      SERVICE_ROLE_KEY: ${STRATA_SERVICE_ROLE_KEY:?Initialize local development credentials}
      SUPABASE_PUBLISHABLE_KEY: ""
      SUPABASE_SECRET_KEY: ""
      ANON_KEY_ASYMMETRIC: ""
      SERVICE_ROLE_KEY_ASYMMETRIC: ""
      SUPABASE_PUBLIC_URL: http://127.0.0.1:54321
      DASHBOARD_USERNAME: stratadrive-dev
      DASHBOARD_PASSWORD: ${STRATA_DASHBOARD_PASSWORD:?Initialize local development credentials}
    entrypoint: [/bin/sh, /docker-entrypoint.sh]
    healthcheck:
      test: [CMD-SHELL, "timeout 1 bash -c '</dev/tcp/127.0.0.1/8000'"]
      interval: 5s
      timeout: 5s
      retries: 10

networks:
  default:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.host_binding_ipv4: "127.0.0.1"

volumes:
  db-data:
    # Preserve the partially initialized first volume for later guarded cleanup.
    name: ${STRATA_DATA_VOLUME:-stratadrive-local_db-data-bootstrap-v2}
  db-config:
  snippets:
